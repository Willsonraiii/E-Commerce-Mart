# Deploy the API (Express + SQLite) on Render's free tier with a persistent disk.
# Vercel serves the site; this serves /api and /uploads.
#
#   1. Push this repo to GitHub.
#   2. Render dashboard -> New -> Blueprint -> pick this repo.
#   3. Copy the resulting URL (e.g. https://yalambar-api.onrender.com).
#   4. In Vercel, set VITE_API_URL to that URL + /api, then redeploy.
services:
  - type: web
    name: yalambar-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render creates a strong random secret
      - key: ADMIN_EMAIL
        sync: false                  # set these yourself in the dashboard
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_FILE
        value: /var/data/yalamber.db # <- on the persistent disk below
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGIN
        sync: false                  # your Vercel URL, e.g. https://yalambar.vercel.app
    disk:
      name: yalambar-data
      mountPath: /var/data           # survives restarts and redeploys
      sizeGB: 1
